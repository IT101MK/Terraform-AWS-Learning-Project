name: Terraform CI

# Static checks only - no AWS credentials, no plan/apply. Just proves the
# config is correctly formatted and internally valid on every push/PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt (check only, no changes made)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, no credentials needed)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
